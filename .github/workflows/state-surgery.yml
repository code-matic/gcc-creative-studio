# ONE-OFF state surgery after the out-of-band teardown of creative-studio-db
# (deleted via gcloud during the 10.47 re-addressing migration, 2026-09-03).
#
# Why: the Terraform state still holds children of the deleted instance
# (google_sql_user errors with instanceDoesNotExist on refresh), and the
# random_id suffix would recreate the instance under its old name, which
# Cloud SQL reserves for ~7 days after deletion.
#
# Run once via workflow_dispatch, verify the deploy pipeline goes green,
# then DELETE this file.
name: State Surgery (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WIF_PROVIDER: projects/678869232430/locations/global/workloadIdentityPools/frontrunner-github/providers/github-oidc
  DEPLOY_SA: frontrunner-deploy@rain-frontrunner-wkld-01.iam.gserviceaccount.com

jobs:
  state-surgery:
    runs-on: ubuntu-latest
    # Same approval gate as a manual deploy — this job mutates remote state.
    environment: production
    defaults:
      run:
        working-directory: infra/environments/dev-infra-example
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Show postgresql state before
        run: terraform state list | grep -E 'postgresql' || echo "(none)"

      - name: Remove stale children of the deleted instance
        run: |
          terraform state rm 'module.creative_studio_platform.module.postgresql.google_sql_user.default' \
            || echo "sql_user not in state — already clean"
          terraform state rm 'module.creative_studio_platform.module.postgresql.google_sql_database.default' \
            || echo "sql_database not in state — already clean"

      - name: Regenerate db name suffix (old name is reserved ~7 days)
        run: |
          terraform state rm 'module.creative_studio_platform.module.postgresql.random_id.db_name_suffix' \
            || echo "random_id not in state — already clean"

      - name: Show postgresql state after
        run: terraform state list | grep -E 'postgresql' || echo "(none)"
